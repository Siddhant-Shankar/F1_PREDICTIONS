[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1pred"
version = "0.1.0"
description = "Probabilistic Formula 1 race outcome forecasting with learning-to-rank and Monte Carlo simulation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Siddhant Shankar" }]
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
explain = ["shap>=0.44"]
app = ["streamlit>=1.45", "plotly>=5.18"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
f1pred = "f1pred.cli:main"

[tool.setuptools.packages.find]
include = ["f1pred*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
